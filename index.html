<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121110">
<title>진가</title>
<link rel="icon" href="jewelry/common/icon-jewelry.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #f6f2ea; --fg: #1b1917; --line: #d9cfbf; --sub: #6f675d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121110; --fg: #efe8dc; --line: #3a352f; --sub: #a59c8f; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: "Noto Serif KR", "Batang", serif; }
  main { width: min(420px, 100% - 32px); text-align: center; }
  h1 { font-weight: 500; letter-spacing: .2em; margin: 0 0 6px; }
  p { color: var(--sub); margin: 0 0 28px; font-size: 15px; }
  a { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin: 10px 0; border: 1px solid var(--line);
      border-radius: 10px; color: inherit; text-decoration: none; font-size: 18px; }
  a img { width: 44px; height: 44px; border-radius: 9px; }
</style>
</head>
<body>
<main>
  <h1>JINGA</h1>
  <p>나라별 진짜가격 비교</p>
  <a href="jewelry/"><img src="jewelry/common/icon-jewelry.svg" alt="">진가 주얼리</a>
  <a href="fashion/"><img src="fashion/common/icon-fashion.svg" alt="">진가 패션</a>
</main>
</body>
</html>
