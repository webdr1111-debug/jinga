<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="겨울밤 후쿠오카 거리와 크리스마스 마켓 그림">
  <!-- 럭스캐너 직접 그린 그래픽 (2026-10-29): 12월 후쿠오카 쇼핑 배너. 실제 건물·상표를 그대로 옮기지 않은 일반적인 도시·마켓 그림 -->
  <defs>
    <radialGradient id="sky" cx="72%" cy="18%" r="90%">
      <stop offset="0" stop-color="#2B3850"/><stop offset=".55" stop-color="#17202E"/><stop offset="1" stop-color="#0E141F"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D3A6"/><stop offset="1" stop-color="#B8935A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2C879" stop-opacity=".9"/><stop offset="1" stop-color="#F2C879" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#17202E" stop-opacity="0"/><stop offset="1" stop-color="#17202E" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#sky)"/>
  <!-- 별·눈 -->
  <g fill="#F4EEE3">
    <circle cx="80" cy="70" r="2.2" opacity=".8"/><circle cx="190" cy="140" r="1.6" opacity=".6"/><circle cx="300" cy="60" r="2" opacity=".7"/>
    <circle cx="420" cy="120" r="1.4" opacity=".5"/><circle cx="560" cy="50" r="1.8" opacity=".7"/><circle cx="820" cy="90" r="2.2" opacity=".8"/>
    <circle cx="760" cy="200" r="1.5" opacity=".5"/><circle cx="130" cy="230" r="1.8" opacity=".6"/><circle cx="350" cy="210" r="1.3" opacity=".5"/>
    <circle cx="880" cy="260" r="1.6" opacity=".6"/><circle cx="40" cy="330" r="1.4" opacity=".5"/><circle cx="470" cy="280" r="1.2" opacity=".4"/>
  </g>
  <!-- 달 -->
  <circle cx="700" cy="150" r="46" fill="#F4EEE3" opacity=".92"/>
  <circle cx="722" cy="138" r="46" fill="#22304A"/>
  <!-- 먼 도시 -->
  <g fill="#22304A">
    <rect x="0" y="470" width="70" height="200"/><rect x="60" y="430" width="55" height="240"/><rect x="110" y="490" width="80" height="180"/>
    <rect x="185" y="450" width="50" height="220"/><rect x="560" y="460" width="60" height="210"/><rect x="615" y="420" width="70" height="250"/>
    <rect x="680" y="480" width="55" height="190"/><rect x="730" y="440" width="70" height="230"/><rect x="795" y="490" width="105" height="180"/>
  </g>
  <g fill="#F2C879" opacity=".55">
    <rect x="72" y="450" width="8" height="10"/><rect x="92" y="470" width="8" height="10"/><rect x="72" y="490" width="8" height="10"/>
    <rect x="130" y="510" width="8" height="10"/><rect x="160" y="530" width="8" height="10"/><rect x="200" y="470" width="8" height="10"/>
    <rect x="630" y="440" width="8" height="10"/><rect x="655" y="470" width="8" height="10"/><rect x="630" y="500" width="8" height="10"/>
    <rect x="745" y="460" width="8" height="10"/><rect x="770" y="490" width="8" height="10"/><rect x="820" y="510" width="8" height="10"/>
  </g>
  <!-- 해변 전망탑 (일반적인 탑 모양) -->
  <g>
    <circle cx="450" cy="300" r="120" fill="url(#glow)" opacity=".35"/>
    <path d="M436 640 L448 230 L452 230 L464 640 Z" fill="url(#tower)"/>
    <path d="M426 640 L444 330 L456 330 L474 640 Z" fill="#B8935A" opacity=".35"/>
    <rect x="430" y="300" width="40" height="34" rx="4" fill="#E9D3A6"/>
    <rect x="434" y="306" width="32" height="6" fill="#17202E" opacity=".55"/>
    <rect x="434" y="318" width="32" height="6" fill="#17202E" opacity=".55"/>
    <line x1="450" y1="230" x2="450" y2="176" stroke="#E9D3A6" stroke-width="3"/>
    <circle cx="450" cy="172" r="5" fill="#F2C879"/>
    <g stroke="#17202E" stroke-width="1.2" opacity=".5">
      <line x1="442" y1="380" x2="458" y2="420"/><line x1="458" y1="380" x2="442" y2="420"/>
      <line x1="440" y1="440" x2="460" y2="490"/><line x1="460" y1="440" x2="440" y2="490"/>
      <line x1="438" y1="510" x2="462" y2="570"/><line x1="462" y1="510" x2="438" y2="570"/>
    </g>
  </g>
  <!-- 가까운 건물 -->
  <g fill="#1B2638">
    <rect x="0" y="560" width="120" height="200"/><rect x="250" y="540" width="120" height="220"/><rect x="520" y="560" width="130" height="200"/><rect x="780" y="545" width="120" height="215"/>
  </g>
  <!-- 전구 줄 -->
  <path d="M0 410 Q225 470 450 420 T900 410" fill="none" stroke="#B8935A" stroke-width="2" opacity=".7"/>
  <g>
    <circle cx="40" cy="418" r="6" fill="#F2C879"/><circle cx="120" cy="438" r="6" fill="#F4EEE3"/><circle cx="200" cy="448" r="6" fill="#F2C879"/>
    <circle cx="280" cy="446" r="6" fill="#E89A7A"/><circle cx="360" cy="434" r="6" fill="#F2C879"/><circle cx="440" cy="421" r="6" fill="#F4EEE3"/>
    <circle cx="520" cy="410" r="6" fill="#F2C879"/><circle cx="600" cy="404" r="6" fill="#E89A7A"/><circle cx="680" cy="404" r="6" fill="#F2C879"/>
    <circle cx="760" cy="408" r="6" fill="#F4EEE3"/><circle cx="840" cy="412" r="6" fill="#F2C879"/>
