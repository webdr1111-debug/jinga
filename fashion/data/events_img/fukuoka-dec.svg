  <!-- 크리스마스 마켓 오두막 -->
  <g>
    <g transform="translate(120 600)">
      <path d="M0 60 L70 0 L140 60 Z" fill="#F4EEE3"/><rect x="10" y="60" width="120" height="90" fill="#E9E0CF"/>
      <rect x="28" y="80" width="84" height="44" fill="#F2C879"/><rect x="28" y="80" width="84" height="10" fill="#B8935A"/>
      <path d="M0 60 L70 0 L140 60" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g transform="translate(600 610)">
      <path d="M0 55 L65 0 L130 55 Z" fill="#F4EEE3"/><rect x="10" y="55" width="110" height="85" fill="#E9E0CF"/>
      <rect x="26" y="74" width="78" height="40" fill="#F2C879"/><rect x="26" y="74" width="78" height="9" fill="#B8935A"/>
      <path d="M0 55 L65 0 L130 55" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- 크리스마스 나무 -->
  <g transform="translate(450 560)">
    <path d="M0 0 L-70 110 L-40 110 L-90 190 L90 190 L40 110 L70 110 Z" fill="#2E5A4A"/>
    <rect x="-12" y="190" width="24" height="26" fill="#6B4A2E"/>
    <path d="M0 -26 L7 -8 L26 -8 L11 3 L16 22 L0 11 L-16 22 L-11 3 L-26 -8 L-7 -8 Z" fill="#F2C879"/>
    <g><circle cx="-30" cy="80" r="7" fill="#F2C879"/><circle cx="25" cy="100" r="7" fill="#E89A7A"/><circle cx="-45" cy="150" r="7" fill="#F4EEE3"/>
      <circle cx="40" cy="160" r="7" fill="#F2C879"/><circle cx="0" cy="130" r="7" fill="#F4EEE3"/></g>
  </g>
  <!-- 눈 덮인 땅 -->
  <path d="M0 760 Q225 730 450 752 T900 742 L900 900 L0 900 Z" fill="#E9E0CF" opacity=".9"/>
  <!-- 쇼핑백 -->
  <g transform="translate(700 690)">
    <path d="M0 30 L80 30 L72 120 L8 120 Z" fill="#B8935A"/><path d="M22 30 Q22 0 40 0 Q58 0 58 30" fill="none" stroke="#17202E" stroke-width="5"/>
    <rect x="28" y="62" width="24" height="24" rx="3" fill="#17202E" opacity=".6"/>
  </g>
  <g transform="translate(150 700)">
    <path d="M0 26 L64 26 L58 100 L6 100 Z" fill="#F4EEE3"/><path d="M18 26 Q18 0 32 0 Q46 0 46 26" fill="none" stroke="#B8935A" stroke-width="5"/>
  </g>
  <!-- 내리는 눈 -->
  <g fill="#FFFFFF" opacity=".85">
    <circle cx="60" cy="520" r="3"/><circle cx="230" cy="380" r="2.5"/><circle cx="330" cy="520" r="3"/><circle cx="540" cy="350" r="2.5"/>
    <circle cx="650" cy="520" r="3"/><circle cx="820" cy="360" r="2.5"/><circle cx="880" cy="560" r="3"/><circle cx="20" cy="640" r="2.5"/>
  </g>
  <rect width="900" height="900" fill="url(#fade)"/>
</svg>
