<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="여러 장의 카드와 해외 통화, 비행기 그림">
  <!-- 럭스캐너 직접 그린 그래픽 (2026-10-29): 해외 결제 카드 혜택 배너. 특정 카드사·브랜드 로고 없음 -->
  <defs>
    <radialGradient id="bg" cx="70%" cy="20%" r="95%">
      <stop offset="0" stop-color="#2B3850"/><stop offset=".55" stop-color="#17202E"/><stop offset="1" stop-color="#0E141F"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBD6A8"/><stop offset=".5" stop-color="#D2B07A"/><stop offset="1" stop-color="#A9844D"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7EF"/><stop offset="1" stop-color="#E6DCC8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3446"/><stop offset="1" stop-color="#121A26"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E2B8"/><stop offset="1" stop-color="#C9A462"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".45" stop-color="#17202E" stop-opacity="0"/><stop offset="1" stop-color="#17202E" stop-opacity=".95"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <!-- 지구 선 -->
  <g fill="none" stroke="#D2B07A" stroke-opacity=".18" stroke-width="2">
    <circle cx="660" cy="250" r="190"/><ellipse cx="660" cy="250" rx="90" ry="190"/><ellipse cx="660" cy="250" rx="160" ry="190"/>
    <line x1="470" y1="250" x2="850" y2="250"/><path d="M490 170 Q660 200 830 170"/><path d="M490 330 Q660 300 830 330"/>
  </g>
  <!-- 비행기 길 -->
  <path d="M90 300 Q330 90 640 150" fill="none" stroke="#F4EEE3" stroke-opacity=".55" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g transform="translate(650 148) rotate(14)">
    <path d="M0 0 L-46 -10 L-50 -4 L-22 2 L-34 22 L-26 24 L-6 6 L18 8 Q28 8 28 2 Q28 -4 18 -4 Z" fill="#F4EEE3"/>
  </g>
  <!-- 카드 세 장 -->
  <g filter="url(#sh)">
    <g transform="translate(150 360) rotate(-14)">
      <rect width="400" height="250" rx="22" fill="url(#dark)" stroke="#D2B07A" stroke-opacity=".6" stroke-width="2"/>
      <rect x="34" y="70" width="64" height="48" rx="8" fill="url(#chip)"/>
      <g fill="#D2B07A" opacity=".55"><rect x="34" y="180" width="60" height="10" rx="5"/><rect x="104" y="180" width="60" height="10" rx="5"/><rect x="174" y="180" width="60" height="10" rx="5"/><rect x="244" y="180" width="60" height="10" rx="5"/></g>
    </g>
    <g transform="translate(240 330) rotate(-4)">
      <rect width="400" height="250" rx="22" fill="url(#ivory)"/>
      <rect x="34" y="70" width="64" height="48" rx="8" fill="url(#chip)"/>
      <g fill="none" stroke="#17202E" stroke-opacity=".55" stroke-width="5" stroke-linecap="round">
        <path d="M128 78 Q140 94 128 110"/><path d="M144 70 Q162 94 144 118"/><path d="M160 62 Q184 94 160 126"/>
      </g>
      <g fill="#17202E" opacity=".35"><rect x="34" y="180" width="60" height="10" rx="5"/><rect x="104" y="180" width="60" height="10" rx="5"/><rect x="174" y="180" width="60" height="10" rx="5"/><rect x="244" y="180" width="60" height="10" rx="5"/></g>
      <rect x="300" y="34" width="66" height="18" rx="9" fill="#17202E" opacity=".12"/>
    </g>
    <g transform="translate(330 300) rotate(7)">
      <rect width="400" height="250" rx="22" fill="url(#gold)"/>
      <rect x="34" y="70" width="64" height="48" rx="8" fill="#F8EDD2" stroke="#9C7A44" stroke-width="2"/>
      <g stroke="#9C7A44" stroke-width="2"><line x1="34" y1="94" x2="98" y2="94"/><line x1="66" y1="70" x2="66" y2="118"/></g>
      <g fill="#17202E" opacity=".4"><rect x="34" y="180" width="60" height="10" rx="5"/><rect x="104" y="180" width="60" height="10" rx="5"/><rect x="174" y="180" width="60" height="10" rx="5"/><rect x="244" y="180" width="60" height="10" rx="5"/></g>
      <path d="M330 40 l10 20 l22 3 l-16 15 l4 22 l-20 -11 l-20 11 l4 -22 l-16 -15 l22 -3 z" fill="#17202E" opacity=".25"/>
    </g>
  </g>
  <!-- 할인 표 -->
  <g transform="translate(700 560)" filter="url(#sh)">
    <circle r="78" fill="#D2B07A"/><circle r="64" fill="none" stroke="#17202E" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 6"/>
    <g fill="#17202E"><circle cx="-22" cy="-22" r="13"/><circle cx="22" cy="24" r="13"/><rect x="-6" y="-44" width="12" height="88" rx="6" transform="rotate(38)"/></g>
  </g>
  <!-- 통화 동전 -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <g transform="translate(130 650)"><circle r="48" fill="#F4EEE3"/><circle r="40" fill="none" stroke="#B8935A" stroke-width="3"/><text y="17" font-size="48" fill="#17202E">¥</text></g>
    <g transform="translate(240 735)"><circle r="40" fill="#D2B07A"/><circle r="33" fill="none" stroke="#17202E" stroke-opacity=".4" stroke-width="3"/><text y="15" font-size="40" fill="#17202E">$</text></g>
    <g transform="translate(110 790)"><circle r="34" fill="#2A3446" stroke="#D2B07A" stroke-width="3"/><text y="13" font-size="34" fill="#D2B07A">€</text></g>
  </g>
  <!-- 반짝임 -->
  <g fill="#F4EEE3">
    <path d="M560 120 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z" opacity=".8"/>
    <path d="M820 420 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" opacity=".7"/>
    <path d="M70 200 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" opacity=".6"/>
  </g>
  <rect width="900" height="900" fill="url(#fade)"/>
</svg>
